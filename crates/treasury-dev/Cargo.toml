[package]
name = "treasury-dev"
description = "Ferramentas de desenvolvimento do Treasury (servidor HTTP da API e MCP). Não vai para o usuário final."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "treasury-dev"
path = "src/main.rs"

[dependencies]
# KDF rápido: cofres de desenvolvimento abrem na hora (nunca use com dados reais).
treasury-core = { workspace = true, features = ["fast-kdf"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
axum.workspace = true
tower-http.workspace = true
getrandom.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile = "3"
