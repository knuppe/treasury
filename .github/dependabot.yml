# Atualizações de dependências (docs/distribution.md): uma rodada por mês, agrupada, com no
# máximo 3 PRs abertos por ecossistema; correções de segurança chegam a qualquer momento (alertas
# do Dependabot). Os commits seguem a regra em inglês (`build(deps): …`). Um crate ou pacote npm
# novo na árvore faz o deps-check do CI falhar: entra só com a aprovação do mantenedor
# (docs/development.md, "Dependencies").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 3
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # 0.23 quebra o modelo de detecção do PaddleOCR (ocr-paddle); ficar na 0.22.
      - dependency-name: tract-onnx
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # O refinery 0.10 aceita só rusqlite até 0.41.
      - dependency-name: rusqlite
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Os tipos das respostas do IMAP têm de ser os do imap 3.0 (que usa o imap-proto 0.16).
      - dependency-name: imap-proto
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 3
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # Os tipos do Node seguem a versão usada no CI e no build (Node 22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript e o lint com tipos (oxlint-tsgolint) andam juntos: a próxima versão maior de
      # um só entra com a do outro, numa migração própria.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
